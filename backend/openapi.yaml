openapi: 3.0.3
info:
  title: Field Incident Reporter API
  version: 1.1.0
  description: |
    Mock API shared by the Android/iOS app (Technicians) and the web dashboard (Operators).

    **Identity.** There is no login. Every request carries `X-User-Id` with the id of a seeded user
    (see `GET /users`). The user's role decides what they may do.

    **Rules enforced by the server**
    - Only Operators change `status`, `assignee` and `resolutionNote`. Technicians cannot.
    - A Technician can edit, delete or change photos of an Incident only while it is `OPEN`
      and only if they reported it. Otherwise the server answers `409 NOT_OPEN` (a Conflict;
      the server version wins and clients must discard the change).
    - Incident and photo ids are generated by the client (UUID). Creating twice with the same id is safe.
    - An Incident has at most 5 photos.
    - Deleting something that no longer exists succeeds (`204`), so sync retries are safe.
servers:
  - url: http://localhost:3000
    description: Local (iOS simulator, web dashboard)
  - url: http://10.0.2.2:3000
    description: Android emulator
security:
  - UserId: []
tags:
  - name: Users
  - name: Incidents
  - name: Photos
paths:
  /users:
    get:
      tags: [Users]
      summary: List the seeded users (used by the "choose who you are" picker)
      description: Public. It does not need `X-User-Id`, because it runs before a user is chosen.
      security: []
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/User' } }
  /incidents:
    get:
      tags: [Incidents]
      summary: List Incidents
      description: |
        Served by json-server. Equality filters take any top-level field. For example
        `?status=OPEN&severity=HIGH&reportedBy=u-tech-1`. Technician apps pass their own id as `reportedBy`.

        `assigned` filters on whether an Incident has an assignee at all: `assigned=false` returns only
        Incidents whose `assignee` is `null`; `assigned=true` only those with an assignee. Leaving it out
        does not filter on assignee. All filters combine with AND, so `assigned=false&assignee=u-op-1`
        matches nothing (`200` with an empty array), and `assigned=true&assignee=u-op-1` is the same as
        `assignee=u-op-1`. Sorting, paging and `X-Total-Count` apply to the rows left after every filter,
        `assigned` included.
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/Status' } }
        - { name: severity, in: query, schema: { $ref: '#/components/schemas/Severity' } }
        - { name: category, in: query, schema: { $ref: '#/components/schemas/Category' } }
        - { name: reportedBy, in: query, schema: { type: string } }
        - { name: assignee, in: query, description: An Operator user id. Matches Incidents assigned to that Operator., schema: { type: string } }
        - { name: assigned, in: query, description: '`false` for unassigned Incidents (`assignee` is `null`), `true` for assigned ones. Any other value, or the parameter given more than once, is `422 VALIDATION_ERROR`.', schema: { type: boolean } }
        - { name: q, in: query, description: Full-text search, schema: { type: string } }
        - { name: createdAt_gte, in: query, description: Created on or after (ISO 8601), schema: { type: string, format: date-time } }
        - { name: createdAt_lte, in: query, description: Created on or before (ISO 8601), schema: { type: string, format: date-time } }
        - { name: _sort, in: query, schema: { type: string, example: createdAt } }
        - { name: _order, in: query, schema: { type: string, enum: [asc, desc] } }
        - { name: _page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: _limit, in: query, description: Page size. The total comes back in the `X-Total-Count` header., schema: { type: integer } }
      responses:
        '200':
          description: Incidents
          headers:
            X-Total-Count: { description: 'Total matches across every filter (including `assigned`) when `_page`/`_limit` is used, not just the rows on this page', schema: { type: integer } }
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Incident' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { description: 'Invalid query: `assigned` is not exactly `true` or `false`, or is repeated (`VALIDATION_ERROR`)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    post:
      tags: [Incidents]
      summary: Report an Incident (Technician)
      description: Idempotent by `id`. A repeat of the same id by the same Technician returns the existing Incident with `200`. Status is always `OPEN`. Photos are uploaded afterwards.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IncidentCreate' }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Incident' } } } }
        '200': { description: Already created with this id, content: { application/json: { schema: { $ref: '#/components/schemas/Incident' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: The id belongs to another Technician (`ID_TAKEN`), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { $ref: '#/components/responses/Validation' }
  /incidents/{incidentId}:
    parameters:
      - { name: incidentId, in: path, required: true, schema: { type: string } }
    get:
      tags: [Incidents]
      summary: Get one Incident
      responses:
        '200': { description: The Incident, content: { application/json: { schema: { $ref: '#/components/schemas/Incident' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Incidents]
      summary: Edit an Incident
      description: |
        **Technician** (reporter, Incident `OPEN`): `title`, `description`, `category`, `severity`, `location`.
        **Operator**: `status`, `assignee`, `resolutionNote`. A status change appends to `activityLog`
        and sets or clears `resolvedAt`. Any status may move to any other.
        Sending a field your role may not change gives `403`; unknown fields give `422`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - { $ref: '#/components/schemas/TechnicianEdit' }
                - { $ref: '#/components/schemas/OperatorEdit' }
      responses:
        '200': { description: Updated Incident, content: { application/json: { schema: { $ref: '#/components/schemas/Incident' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/NotOpen' }
        '422': { $ref: '#/components/responses/Validation' }
    delete:
      tags: [Incidents]
      summary: Delete an Incident (Technician, reporter, `OPEN` only)
      description: Hard delete, including its photo files. Succeeds with `204` if the Incident is already gone.
      responses:
        '204': { description: Deleted (or already absent) }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/NotOpen' }
  /incidents/{incidentId}/photos:
    parameters:
      - { name: incidentId, in: path, required: true, schema: { type: string } }
    post:
      tags: [Photos]
      summary: Upload a photo (Technician, reporter, `OPEN` only)
      description: Idempotent by the client-generated photo `id`. A repeat returns the stored photo with `200`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [id, file]
              properties:
                id: { type: string, description: Client-generated UUID }
                file: { type: string, format: binary, description: image/jpeg or image/png, at most 10 MB }
      responses:
        '201': { description: Stored, content: { application/json: { schema: { $ref: '#/components/schemas/Photo' } } } }
        '200': { description: Already stored with this id, content: { application/json: { schema: { $ref: '#/components/schemas/Photo' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/NotOpen' }
        '413': { description: File larger than 10 MB, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: Invalid file or the 5 photo limit (`PHOTO_LIMIT`), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /incidents/{incidentId}/photos/{photoId}:
    parameters:
      - { name: incidentId, in: path, required: true, schema: { type: string } }
      - { name: photoId, in: path, required: true, schema: { type: string } }
    delete:
      tags: [Photos]
      summary: Remove a photo (Technician, reporter, `OPEN` only)
      description: Succeeds with `204` if the photo is already gone.
      responses:
        '204': { description: Removed (or already absent) }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/NotOpen' }
components:
  securitySchemes:
    UserId:
      type: apiKey
      in: header
      name: X-User-Id
  responses:
    Unauthenticated: { description: Missing or unknown `X-User-Id`, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Forbidden: { description: Wrong role or not the reporter, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    NotFound: { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    NotOpen: { description: 'Conflict: the Incident is no longer `OPEN` (`NOT_OPEN`). Discard the local change and show the server version.', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Validation: { description: Invalid body (`VALIDATION_ERROR`), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  schemas:
    Role: { type: string, enum: [TECHNICIAN, OPERATOR] }
    Category: { type: string, enum: [EQUIPMENT, ROAD_HAZARD, SAFETY, OTHER] }
    Severity: { type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL] }
    Status: { type: string, enum: [OPEN, IN_PROGRESS, RESOLVED] }
    User:
      type: object
      required: [id, name, role]
      properties:
        id: { type: string, example: u-tech-1 }
        name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
    Location:
      type: object
      description: Coordinates are optional but come as a pair. A report can carry only an address.
      properties:
        latitude: { type: number, minimum: -90, maximum: 90, nullable: true }
        longitude: { type: number, minimum: -180, maximum: 180, nullable: true }
        address: { type: string, maxLength: 300, nullable: true }
    Photo:
      type: object
      required: [id, url, createdAt]
      properties:
        id: { type: string }
        url: { type: string, format: uri, description: Absolute URL built from the host the client used }
        createdAt: { type: string, format: date-time }
    ActivityEntry:
      type: object
      required: [at, actorId, status]
      properties:
        at: { type: string, format: date-time }
        actorId: { type: string }
        status: { $ref: '#/components/schemas/Status' }
    Incident:
      type: object
      required: [id, title, description, category, severity, status, location, photos, reportedBy, assignee, resolutionNote, resolvedAt, activityLog, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 2000 }
        category: { $ref: '#/components/schemas/Category' }
        severity: { $ref: '#/components/schemas/Severity' }
        status: { $ref: '#/components/schemas/Status' }
        location: { $ref: '#/components/schemas/Location' }
        photos: { type: array, maxItems: 5, items: { $ref: '#/components/schemas/Photo' } }
        reportedBy: { type: string, description: Technician user id }
        assignee: { type: string, nullable: true, description: Operator user id }
        resolutionNote: { type: string, nullable: true, maxLength: 2000 }
        resolvedAt: { type: string, format: date-time, nullable: true }
        activityLog: { type: array, items: { $ref: '#/components/schemas/ActivityEntry' } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    IncidentCreate:
      type: object
      required: [id, title, category, severity]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid, description: Generated by the client }
        title: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 2000 }
        category: { $ref: '#/components/schemas/Category' }
        severity: { $ref: '#/components/schemas/Severity' }
        location: { $ref: '#/components/schemas/Location' }
    TechnicianEdit:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 2000 }
        category: { $ref: '#/components/schemas/Category' }
        severity: { $ref: '#/components/schemas/Severity' }
        location: { $ref: '#/components/schemas/Location' }
    OperatorEdit:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        status: { $ref: '#/components/schemas/Status' }
        assignee: { type: string, nullable: true, description: An Operator user id or null }
        resolutionNote: { type: string, nullable: true, maxLength: 2000 }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: NOT_OPEN }
            message: { type: string }
